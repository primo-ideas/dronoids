[package]
name = "dronoids"
version = "0.1.0"
edition = "2024"
default-run = "dronoids"

[dependencies]
bincode = "1"
macroquad = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Native only: the browser build talks WebSocket through a small JS plugin.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hmac = "0.13.0"
sha2 = "0.11.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[[bin]]
name = "dronoids-server"
path = "src/bin/server.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
